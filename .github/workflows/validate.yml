name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run local validation
        run: |
          chmod +x scripts/validate.sh
          bash scripts/validate.sh

      - name: Run ShellCheck if available
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck install/*.sh scripts/*.sh codex/corfu/scripts/*.sh claude/corfu/scripts/*.sh
          else
            echo "ShellCheck is not installed; skipping."
          fi
