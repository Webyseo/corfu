interface:
  display_name: "Corfu"
  short_description: "Closure, forecast, and stop-loss auditor."
  brand_color: "#0F172A"
  default_prompt: |-
    $corfu

    Run the default closure audit on the current repository state. Do not edit files. Decide whether this is closable, blocked, risky, looping, or worth continuing. Give exactly one next action.
policy:
  allow_implicit_invocation: false
